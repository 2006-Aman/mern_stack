<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Queue</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d9edf7;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .card {
    width: 380px;
    background: #ffffff;
    border-radius: 14px;
    padding: 28px 28px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  h1 {
    margin: 0 0 18px;
    font-size: 22px;
    font-weight: 600;
    color: #222;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .now-playing {
    font-size: 15px;
    color: #333;
    margin-bottom: 14px;
  }

  #songInput {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #7ec9e8;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
  }
  #songInput:focus {
    border-color: #2196c9;
    box-shadow: 0 0 0 3px rgba(33,150,201,0.15);
  }

  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }

  button {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:active { opacity: 0.75; }

  #addBtn { background: #2f9be0; }
  #playBtn { background: #2fa96a; }

  .queue {
    border-top: 1px solid #e5e5e5;
    padding-top: 8px;
  }

  .queue-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 4px;
    font-size: 14px;
    color: #333;
    border-bottom: 1px solid #f0f0f0;
  }
  .queue-item:last-child { border-bottom: none; }

  .remove-btn {
    background: none;
    color: #c0392b;
    border: none;
    font-size: 13px;
    padding: 0 4px;
    flex: none;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    color: #999;
    font-size: 13px;
    padding: 10px 0;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎵 Music Queue</h1>
  <div class="now-playing">Now Playing: <span id="nowPlaying">None</span></div>

  <input type="text" id="songInput" placeholder="Enter song name">

  <div class="buttons">
    <button id="addBtn" onclick="addSong()">Add Song</button>
    <button id="playBtn" onclick="playSong()">Play Song</button>
  </div>

  <div class="queue" id="queueList"></div>
</div>

<script>
  let queue = ["Believer", "Tere Naina"];

  function render() {
    const list = document.getElementById('queueList');
    list.innerHTML = '';
    if (queue.length === 0) {
      list.innerHTML = '<div class="empty">Queue is empty</div>';
      return;
    }
    queue.forEach((song, i) => {
      const item = document.createElement('div');
      item.className = 'queue-item';
      item.innerHTML = `<span>${i + 1}. ${song}</span>
        <button class="remove-btn" onclick="removeSong(${i})">✕</button>`;
      list.appendChild(item);
    });
  }

  function addSong() {
    const input = document.getElementById('songInput');
    const name = input.value.trim();
    if (!name) return;
    queue.push(name);
    input.value = '';
    render();
  }

  function playSong() {
    if (queue.length === 0) return;
    const song = queue.shift();
    document.getElementById('nowPlaying').textContent = song;
    render();
  }

  function removeSong(index) {
    queue.splice(index, 1);
    render();
  }

  document.getElementById('songInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addSong();
  });

  render();
</script>

</body>
</html>
